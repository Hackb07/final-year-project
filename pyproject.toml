[project]
name = "capcell-ai"
version = "0.1.0"
description = "AI-Assisted Capsule Endoscopy Analysis and Multi-Agent Report Generation System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "B. Tharun Bala" },
]
keywords = ["capsule-endoscopy", "medical-ai", "yolo", "llm", "agentic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # Computer vision
    "ultralytics>=8.3.0",
    "torch>=2.1.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    # Web / API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0",
    # LLM agents (Groq, OpenAI-compatible)
    "openai>=1.0.0",
    # Gradio web UI
    "gradio>=4.0.0",
    # PDF report generation
    "xhtml2pdf>=0.2.11",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
